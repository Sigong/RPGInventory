
plugins {
    alias(libs.plugins.shadow)
    alias(libs.plugins.bukkit)
    alias(libs.plugins.versions)
    id('jacoco')
}

group = 'ru.endlesscode.rpginventory'
version = pluginVersion
description = pluginDesc

def javaVersion = 21

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
    sourceCompatibility = JavaVersion.toVersion(javaVersion)
    targetCompatibility = JavaVersion.toVersion(javaVersion)
}

// Configure Java toolchain for all tasks
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = javaVersion
    javaCompiler = javaToolchains.compilerFor {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
}

tasks.withType(Jar).configureEach {
    manifest {
        attributes(
            'Build-Jdk': "${System.getProperty('java.version')}",
            'Build-Jdk-Spec': "${javaVersion}",
            'Multi-Release': 'true'
        )
    }
}

allprojects {
    apply plugin: 'java'
    
    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(javaVersion)
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = javaVersion
    }
}

bukkit {
    meta {
        name.set("RPGInventory")
        main.set("${group}.RPGInventory")
        apiVersion.set("1.19")
        authors.set(["osipxd", "EndlessCode Group", "noon", "XXX10Tacles"])
    }

    server {
        core = "paper"
        eula = true
    }
}



repositories {
    mavenCentral()
    
    exclusiveContent {
        forRepository {
            maven {
                url = uri('https://hub.spigotmc.org/nexus/content/repositories/snapshots/')
            }
        }
        filter {
            includeGroup 'org.bukkit'
            includeGroup 'org.spigotmc'
        }
    }

    maven {
        name = 'phoenixDev'
        url = uri('https://nexus.phoenixdevt.fr/repository/maven-public/')
    }
    
    maven {
        name = 'placeholderAPI'
        url = uri('https://repo.extendedclip.com/releases/')
    }
    
    maven {
        url = uri('https://oss.sonatype.org/content/repositories/snapshots')
    }
    
    maven {
        url = uri('https://repo.purpurmc.org/snapshots')
    }
    
    flatDir {
        dirs 'libs'
    }
}




tasks.shadowJar {
    minimize()
    configurations = [project.configurations.runtimeClasspath]
    
    destinationDirectory = file('build/libs')
    archiveClassifier = 'all'
    mergeServiceFiles()
    
    dependencies {
        exclude(dependency('com.google.code.gson:gson:.*'))
        exclude(dependency('org.jetbrains:annotations:.*'))
    }

    exclude('DebugProbesKt.bin')
    exclude('META-INF/proguard/**')
    exclude('META-INF/native-image/**')


    def shadowPackage = 'shade.ru.endlesscode.rpginventory'
    relocate('com.comphenix.packetwrapper', "${shadowPackage}.packetwrapper")
    relocate('ru.endlesscode.inspector', "${shadowPackage}.inspector")
    relocate('kotlinx', "${shadowPackage}.kotlinx")
    relocate('kotlin', "${shadowPackage}.kotlin")
    relocate('io.sentry', "${shadowPackage}.sentry")
    relocate('org.bstats', "${shadowPackage}.bstats")
}

dependencies {
    implementation(libs.snakeyaml)
    implementation(libs.gson)
    implementation(libs.guava)
    compileOnly(libs.bungeecord.chat)
    
    implementation(platform('net.kyori:adventure-bom:4.14.0'))
    implementation('net.kyori:adventure-api')
    compileOnly('net.kyori:adventure-platform-bukkit:4.3.2')

    compileOnly(name: 'purpur-api-1.21-R0.1-20240705.040837-23')

    compileOnly(libs.vault) {
        exclude(group: 'org.bukkit')
    }
    compileOnly(libs.protocollib)
    compileOnly('org.jetbrains:annotations:23.0.0')
    compileOnly(libs.placeholderapi)
    compileOnly(libs.mimic)
    
    implementation(libs.inspector.bukkit)
    implementation(libs.inspector.sentry)
    implementation(libs.inspector.sentry.bukkit)
    implementation(name: 'PacketWrapper')
    implementation(libs.bstats)
    
    testImplementation(libs.junit)
    testImplementation(libs.mockito)

    compileOnly(libs.profile.api)
    compileOnly(libs.mythiclib)
}

tasks.assemble.dependsOn tasks.shadowJar
tasks.check.dependsOn tasks.jacocoTestReport